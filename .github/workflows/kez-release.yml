name: kez release

# Lean release pipeline for kez: cross-compiles cmd/kez for linux/macos/windows
# (x64/arm64) from a single runner, archives each with a SHA-256 checksum, and
# publishes them to a GitHub Release. scripts/install.sh and `kez update`
# download these assets by name (kez-v<version>-<os>-<arch>).
#
# Two ways to cut a release:
#   1. Manual (recommended): Actions tab -> "kez release" -> Run workflow ->
#      pick a bump (patch/minor/major). The next version is computed from the
#      latest release automatically, the tag is created, and binaries publish.
#      No local tagging needed.
#   2. Push a semver tag yourself: `git tag v1.2.3 && git push origin v1.2.3`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (computed from the latest release)"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write # create tags + releases and upload assets

# Serialize releases so two concurrent runs can't compute the same next version.
concurrency:
  group: kez-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish kez binaries
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Triggered by a pushed tag: use it verbatim.
            tag="${GITHUB_REF#refs/tags/}"
          else
            # Manual run: compute the next version from the latest release.
            bump="${{ github.event.inputs.bump }}"
            latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
            [ -n "$latest" ] || latest="v0.0.0"
            ver="${latest#v}"
            IFS='.' read -r major minor patch <<<"$ver"
            major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch|"") patch=$((patch + 1)) ;;
              *) echo "unknown bump '$bump'" >&2; exit 1 ;;
            esac
            tag="v${major}.${minor}.${patch}"
            echo "next version: ${latest} -> ${tag} (${bump})"
          fi
          case "$tag" in
            v*) : ;;
            *) echo "tag must start with 'v' (got '$tag')" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build, archive, and checksum every target
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          # target rows: "<GOOS> <GOARCH> <install-name-os> <install-name-arch>"
          # os/arch names MUST match scripts/install.sh / install.ps1
          # (linux|macos|windows, x64|arm64). Unix targets ship a .tar.gz with a
          # `kez` binary; windows ships a .zip with `kez.exe`.
          printf '%s\n' \
            "linux amd64 linux x64" \
            "linux arm64 linux arm64" \
            "darwin amd64 macos x64" \
            "darwin arm64 macos arm64" \
            "windows amd64 windows x64" \
            "windows arm64 windows arm64" \
          | while read -r goos goarch os arch; do
              stage="dist/stage-${os}-${arch}"
              mkdir -p "$stage"
              bin="kez"
              [ "$goos" = "windows" ] && bin="kez.exe"
              echo "building ${goos}/${goarch} -> ${os}-${arch}"
              GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w" -o "$stage/$bin" ./cmd/kez
              if [ "$goos" = "windows" ]; then
                archive="kez-v${VERSION}-${os}-${arch}.zip"
                ( cd "$stage" && zip -q "../${archive}" "$bin" )
              else
                archive="kez-v${VERSION}-${os}-${arch}.tar.gz"
                tar -czf "dist/${archive}" -C "$stage" "$bin"
              fi
              ( cd dist && sha256sum "$archive" >"${archive}.sha256" )
            done
          echo "--- dist ---"
          ls -la dist

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Create the release if it does not exist yet. --target creates the tag
          # at this commit when it doesn't exist (the manual-bump path); it is
          # ignored when the tag already exists (the pushed-tag path). Idempotent
          # re-runs just re-upload assets onto the existing release.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "kez $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" dist/kez-v* --clobber
