name: kez release

# Release pipeline for kez.
#
# Trigger model:
#   - Push to `main`  -> auto patch bump: the next version is computed from the
#     latest release, a tag + release are created, and binaries publish. No
#     local tagging needed — just push.
#   - Manual (Actions -> "kez release" -> Run workflow) -> pick patch/minor/major
#     when you need a non-patch bump.
#
# Build model:
#   - darwin (macos) binaries are built AND ad-hoc signed on a real macos runner.
#     Apple Silicon's kernel validates __TEXT page hashes at runtime and rejects
#     signatures produced by the Go linker when cross-compiling from Linux
#     (SIGKILL "Code Signature Invalid"). Native `codesign` fixes this.
#   - linux/windows binaries cross-compile fine from ubuntu.
#
# scripts/install.sh and `kez update` download assets by name
# (kez-v<version>-<os>-<arch>).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (computed from the latest release)"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write # create tags + releases and upload assets

# Serialize releases so two concurrent runs can't compute the same next version.
concurrency:
  group: kez-release
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version and create release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Manual runs honor the chosen bump; pushes to main always patch-bump.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bump="${{ github.event.inputs.bump }}"
          else
            bump="patch"
          fi
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          [ -n "$latest" ] || latest="v0.0.0"
          ver="${latest#v}"
          IFS='.' read -r major minor patch <<<"$ver"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch|"") patch=$((patch + 1)) ;;
            *) echo "unknown bump '$bump'" >&2; exit 1 ;;
          esac
          tag="v${major}.${minor}.${patch}"
          echo "next version: ${latest} -> ${tag} (${bump})"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # --target creates the tag at this commit. Tags pushed by the default
          # GITHUB_TOKEN do NOT retrigger workflows, so there's no release loop.
          # Idempotent: a re-run onto an existing tag just reuses the release.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "kez $TAG" \
              --generate-notes
          fi

  build-linux-windows:
    name: Build linux and windows binaries
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build, archive, checksum, and upload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          # target rows: "<GOOS> <GOARCH> <install-name-os> <install-name-arch>"
          # os/arch names MUST match scripts/install.sh / install.ps1.
          printf '%s\n' \
            "linux amd64 linux x64" \
            "linux arm64 linux arm64" \
            "windows amd64 windows x64" \
            "windows arm64 windows arm64" \
          | while read -r goos goarch os arch; do
              stage="dist/stage-${os}-${arch}"
              mkdir -p "$stage"
              bin="kez"
              [ "$goos" = "windows" ] && bin="kez.exe"
              echo "building ${goos}/${goarch} -> ${os}-${arch}"
              GOOS="$goos" GOARCH="$goarch" go build -trimpath \
                -ldflags "-s -w -X github.com/abelcondev/kez/internal/cli.version=${TAG}" \
                -o "$stage/$bin" ./cmd/kez
              if [ "$goos" = "windows" ]; then
                archive="kez-v${VERSION}-${os}-${arch}.zip"
                ( cd "$stage" && zip -q "../${archive}" "$bin" )
              else
                archive="kez-v${VERSION}-${os}-${arch}.tar.gz"
                tar -czf "dist/${archive}" -C "$stage" "$bin"
              fi
              ( cd dist && sha256sum "$archive" >"${archive}.sha256" )
            done
          echo "--- dist ---"
          ls -la dist
          gh release upload "$TAG" dist/kez-v* --repo "$GITHUB_REPOSITORY" --clobber

  build-macos:
    name: Build macos binaries (native signing)
    needs: version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build, sign, archive, checksum, and upload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s\n' \
            "darwin amd64 macos x64" \
            "darwin arm64 macos arm64" \
          | while read -r goos goarch os arch; do
              stage="dist/stage-${os}-${arch}"
              mkdir -p "$stage"
              bin="kez"
              echo "building ${goos}/${goarch} -> ${os}-${arch}"
              GOOS="$goos" GOARCH="$goarch" go build -trimpath \
                -ldflags "-s -w -X github.com/abelcondev/kez/internal/cli.version=${TAG}" \
                -o "$stage/$bin" ./cmd/kez
              # Re-sign ad-hoc with the native codesign so Apple Silicon accepts
              # the binary at runtime. Without this the kernel SIGKILLs it with
              # "Code Signature Invalid" even though `codesign --verify` passes.
              codesign --force --sign - "$stage/$bin"
              codesign --verify --verbose "$stage/$bin"
              archive="kez-v${VERSION}-${os}-${arch}.tar.gz"
              tar -czf "dist/${archive}" -C "$stage" "$bin"
              ( cd dist && shasum -a 256 "$archive" >"${archive}.sha256" )
            done
          echo "--- dist ---"
          ls -la dist
          gh release upload "$TAG" dist/kez-v* --repo "$GITHUB_REPOSITORY" --clobber
